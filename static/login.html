<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CTi · Acesso privado</title>
<link rel="icon" type="image/png" href="/static/img/favicon-32.png">
<link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Inter;src:url(/static/fonts/inter-latin.woff2) format('woff2');font-display:swap;font-weight:400 800}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#0f172a;font-family:Inter,system-ui,sans-serif;color:#0f172a;padding:24px}.wrap{width:min(430px,100%)}.brand{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:22px;color:#fff}.brand img{width:62px;height:62px}.brand strong{font-size:1.7rem}.brand small{display:block;color:#cbd5e1}.card{background:#fff;border-radius:20px;padding:26px;box-shadow:0 24px 70px #0006}.tag{font-size:.73rem;text-transform:uppercase;letter-spacing:.14em;color:#e10613;font-weight:800}.card h1{font-size:1.45rem;margin:8px 0 6px}.muted{color:#64748b;font-size:.9rem;line-height:1.5}.f{display:block;margin-top:16px;font-size:.79rem;font-weight:700;color:#475569}.f input{width:100%;margin-top:6px;border:1px solid #dbe1ea;border-radius:10px;padding:12px 13px;font:inherit;outline:none;background:#fff}.f input:focus{border-color:#e10613;box-shadow:0 0 0 3px #e1061320}.btn{width:100%;border:0;border-radius:10px;background:#e10613;color:#fff;padding:12px;margin-top:18px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.err{display:none;background:#fee2e2;color:#991b1b;border-radius:9px;padding:10px 12px;margin-top:12px;font-size:.85rem}.foot{text-align:center;color:#94a3b8;font-size:.72rem;margin-top:14px}.cfg{background:#fff7ed;color:#9a3412;border-radius:9px;padding:10px 12px;margin-top:12px;font-size:.84rem;display:none}@media(max-width:480px){body{padding:16px}.card{padding:22px;border-radius:16px}.brand{justify-content:flex-start}.brand img{width:52px;height:52px}}
</style>
</head>
<body><div class="wrap">
<div class="brand"><img src="/static/img/icon-192.png" alt="CTi"><div><strong>CTi</strong><small>Centro de Treinamento Intensivo</small></div></div>
<div class="card">
<div class="tag">Acesso privado</div><h1>Entre para continuar</h1>
<p class="muted">O banco de questões, gabaritos, IA e materiais da plataforma ficam protegidos por sessão.</p>
<form id="form" autocomplete="on">
<label class="f">Usuário<input id="user" name="username" autocomplete="username" value="admin" required></label>
<label class="f">Senha<input id="pass" name="password" type="password" autocomplete="current-password" required></label>
<button class="btn" id="btn" type="submit">Entrar</button>
<div class="err" id="err"></div><div class="cfg" id="cfg"></div>
</form>
</div><div class="foot">Sessão segura · cookie HttpOnly · acesso não indexado</div>
</div>
<script>
const f=document.getElementById('form'),b=document.getElementById('btn'),e=document.getElementById('err'),c=document.getElementById('cfg');
async function status(){try{const r=await fetch('/api/auth/status',{cache:'no-store'}),j=await r.json();if(j.authenticated)location.replace('/');if(j.configured===false){c.style.display='block';c.textContent='A segurança ainda não foi configurada na hospedagem. Defina CTI_ACCESS_PASSWORD nas variáveis de ambiente da Vercel.';b.disabled=true}}catch{}}
f.addEventListener('submit',async ev=>{ev.preventDefault();e.style.display='none';b.disabled=true;b.textContent='Entrando…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Não foi possível entrar.');location.replace('/')}catch(x){e.textContent=x.message;e.style.display='block';b.disabled=false;b.textContent='Entrar'}});status();
</script></body></html>
