<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>CTi · Acesso privado</title>

</head>
<body><div class="wrap">
<div class="brand"><img src="/static/img/icon-192.png" alt="CTi"><div><strong>CTi</strong><small>Centro de Treinamento Intensivo</small></div></div>
<div class="card">
<div class="tag">Acesso privado</div><h1>Entre para continuar</h1>
<p class="muted">Acesso restrito à plataforma.</p>
<form id="form" autocomplete="on">
<label class="f">Usuário<input id="user" name="username" autocomplete="username" placeholder="Digite seu usuário" autocapitalize="none" spellcheck="false" autofocus required></label>
<label class="f">Senha<input id="pass" name="password" type="password" autocomplete="current-password" required></label>
<button class="btn" id="btn" type="submit">Entrar</button>
<div class="err" id="err"></div><div class="cfg" id="cfg"></div>
</form>
</div><div class="foot">CTI · Centro de Treinamento Intensivo</div>
</div>
<script src="/static/login.js" defer></script></body></html>
